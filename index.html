<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculator</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Google Fonts for OnePlus style clean typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0c0e;
      --display-text: #ffffff;
      --expr-text: #85888c;
      --btn-num-bg: #1c1d21;
      --btn-num-text: #ffffff;
      --btn-op-bg: #282a2e;
      --btn-op-text: #ffffff;
      --btn-accent-bg: #eb1c24; /* OnePlus Signature Red */
      --btn-accent-text: #ffffff;
      --font-family: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--display-text);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* DISPLAY SECTION */
    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 30px 24px;
      min-height: 180px;
    }

    .expression-display {
      font-size: 20px;
      color: var(--expr-text);
      word-wrap: break-word;
      word-break: break-all;
      text-align: right;
      min-height: 24px;
      margin-bottom: 8px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .result-display {
      font-size: 56px;
      font-weight: 400;
      color: var(--display-text);
      text-align: right;
      width: 100%;
      overflow: hidden; /* Hide scrollbars during offscreen slide transitions */
      white-space: nowrap;
    }
    
    #result {
      display: inline-block;
    }

    #magic-part {
      display: inline-block;
      max-width: 0;
      opacity: 0;
      transform: translateX(-80px);
      transition: max-width 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.12), 
                  transform 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.12), 
                  opacity 0.65s ease;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: bottom;
      color: var(--display-text);
    }

    #magic-part.show-magic {
      max-width: 250px;
      opacity: 1;
      transform: translateX(0);
    }

    /* KEYBOARD SECTION */
    .keyboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 16px 20px 24px;
      background-color: var(--bg-color);
    }

    .btn {
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      outline: none;
      font-family: var(--font-family);
      font-size: 26px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.1s, transform 0.05s;
    }

    /* Interactive press effect */
    .btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    /* Button Colors styling */
    .btn.number {
      background-color: var(--btn-num-bg);
      color: var(--btn-num-text);
    }

    .btn.operator {
      background-color: var(--btn-op-bg);
      color: var(--btn-op-text);
    }

    .btn.function {
      background-color: var(--btn-op-bg);
      color: var(--btn-op-text);
    }

    .btn.equals {
      background-color: var(--btn-accent-bg);
      color: var(--btn-accent-text);
      font-size: 32px;
    }

    /* HIDDEN SETTINGS OVERLAY */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background-color: #0b0c0e;
      color: #ffffff;
      z-index: 2000;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      transform: translateY(100vh);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      overflow-y: auto;
    }

    #settings-overlay.visible {
      transform: translateY(0);
    }

    .settings-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--display-text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-group {
      margin-bottom: 24px;
      background-color: #1c1d21;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #2d2e33;
    }

    .settings-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .settings-item:last-child {
      margin-bottom: 0;
    }

    .settings-item label {
      font-size: 13px;
      font-weight: 500;
      color: #85888c;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .settings-item input[type="text"],
    .settings-item input[type="number"] {
      background: #0b0c0e;
      border: 1px solid #2d2e33;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-family: var(--font-family);
      font-size: 16px;
      outline: none;
    }

    .settings-item input[type="range"] {
      accent-color: var(--btn-accent-bg);
      cursor: pointer;
    }

    .settings-slider-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--btn-accent-bg);
      align-self: flex-end;
      margin-top: -4px;
    }

    .settings-save-btn {
      background-color: var(--btn-accent-bg);
      color: var(--btn-accent-text);
      font-family: var(--font-family);
      border: none;
      border-radius: 100px;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: auto;
      transition: opacity 0.2s;
    }

    .settings-save-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- DISPLAY -->
  <div class="display-container">
    <div class="expression-display" id="expression"></div>
    <div class="result-display">
      <span id="magic-part"></span><span id="result">0</span>
    </div>
  </div>

  <!-- KEYBOARD -->
  <div class="keyboard">
    <!-- Row 1 -->
    <button class="btn function" onclick="pressClear()">C</button>
    <button class="btn function" onclick="pressBackspace()">⌫</button>
    <button class="btn function" onclick="pressPercent()">%</button>
    <button class="btn operator" onclick="pressOp('/')">÷</button>

    <!-- Row 2 -->
    <button class="btn number" onclick="pressNum('7')">7</button>
    <button class="btn number" onclick="pressNum('8')">8</button>
    <button class="btn number" onclick="pressNum('9')">9</button>
    <button class="btn operator" onclick="pressOp('*')">×</button>

    <!-- Row 3 -->
    <button class="btn number" onclick="pressNum('4')">4</button>
    <button class="btn number" onclick="pressNum('5')">5</button>
    <button class="btn number" onclick="pressNum('6')">6</button>
    <button class="btn operator" onclick="pressOp('-')">−</button>

    <!-- Row 4 -->
    <button class="btn number" onclick="pressNum('1')">1</button>
    <button class="btn number" onclick="pressNum('2')">2</button>
    <button class="btn number" onclick="pressNum('3')">3</button>
    <button class="btn operator" onclick="pressOp('+')">+</button>

    <!-- Row 5 -->
    <button class="btn function" onclick="pressNegate()">+/-</button>
    <button class="btn number" onclick="pressNum('0')">0</button>
    <button class="btn number" onclick="pressNum('.')">.</button>
    <button class="btn equals" onclick="pressEquals()">=</button>
  </div>

  <!-- SETTINGS OVERLAY -->
  <div id="settings-overlay">
    <h2 class="settings-title">Settings</h2>
    
    <div class="settings-group">
      <div class="settings-item">
        <label>Default Prediction</label>
        <input type="text" id="opt-default-prediction" value="5" placeholder="e.g. 5">
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-item">
        <label>Reveal Delay (Seconds)</label>
        <input type="range" id="opt-delay" min="0" max="10" step="0.5" value="3" oninput="updateSliderText('opt-delay', 'lbl-delay', 's')">
        <span class="settings-slider-val" id="lbl-delay">3s</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-item">
        <label>Setup Delay (Seconds)</label>
        <input type="range" id="opt-setup-delay" min="0" max="15" step="1" value="5" oninput="updateSliderText('opt-setup-delay', 'lbl-setup-delay', 's')">
        <span class="settings-slider-val" id="lbl-setup-delay">5s</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-item">
        <label>Accelerometer Sensitivity</label>
        <input type="range" id="opt-sensitivity" min="0.5" max="5.0" step="0.1" value="1.5" oninput="updateSliderText('opt-sensitivity', 'lbl-sensitivity', '')">
        <span class="settings-slider-val" id="lbl-sensitivity">1.5</span>
      </div>
    </div>

    <button class="settings-save-btn" onclick="saveSettings()">Save &amp; Close</button>
  </div>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }

    // INITIALIZE OPTIONS FROM LOCALSTORAGE OR DEFAULTS
    let defaultPrediction = localStorage.getItem('magic_defaultPrediction') || '5';
    let motionThreshold = parseFloat(localStorage.getItem('magic_motionThreshold')) || 1.5;
    let revealDelay = parseFloat(localStorage.getItem('magic_revealDelay')) || 3.0; // in seconds
    let setupDelay = parseFloat(localStorage.getItem('magic_setupDelay')) || 5.0; // in seconds

    // CALCULATOR STATE
    let currentInput = '0';
    let storedExpression = '';
    let isEvaluated = false;

    // MAGIC STATE
    let magicPrediction = defaultPrediction;
    let tempPrediction = defaultPrediction;
    let magicPrimed = false;
    let magicSequence = [];
    const SECRET_PATTERN = ['/', '*', '-', '+'];
    let motionTriggered = false;
    let accelerometerGranted = false;
    let primingTimeout = null;

    const exprEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    // Vibration feedback helper (OnePlus style haptic feel) and magic UI cleanup
    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(12);
      }
      cleanupMagicReveal();
    }

    function cleanupMagicReveal() {
      const magicPartEl = document.getElementById('magic-part');
      const typedPartEl = document.getElementById('result');
      if (magicPartEl && magicPartEl.classList.contains('show-magic')) {
        magicPartEl.classList.remove('show-magic');
        magicPartEl.innerText = '';
        typedPartEl.innerText = formatNumber(currentInput);
        adjustDisplayFontSize();
      }
    }

    // Dynamic text auto-scaler for display
    function adjustDisplayFontSize() {
      const magicPartEl = document.getElementById('magic-part');
      const totalLen = ((magicPartEl ? magicPartEl.innerText : '') + resultEl.innerText).length;
      const displayEl = document.querySelector('.result-display');
      if (totalLen > 12) {
        displayEl.style.fontSize = '32px';
      } else if (totalLen > 8) {
        displayEl.style.fontSize = '42px';
      } else {
        displayEl.style.fontSize = '56px';
      }
    }

    function updateDisplay() {
      resultEl.innerText = formatNumber(currentInput);
      exprEl.innerText = storedExpression;
      adjustDisplayFontSize();
    }

    // Format numbers with thousands separators
    function formatNumber(numStr) {
      if (numStr === 'Error' || numStr === 'Infinity' || numStr === '-Infinity') return numStr;
      
      const parts = numStr.split('.');
      let integerPart = parts[0];
      const decimalPart = parts.length > 1 ? '.' + parts[1] : '';

      // Add commas to integer part
      integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return integerPart + decimalPart;
    }

    // BUTTON HANDLERS
    function pressNum(num) {
      triggerHaptic();
      requestAccelerometerPermission(); // Subtle iOS request attempt on tap

      if (isEvaluated) {
        currentInput = num === '.' ? '0.' : num;
        isEvaluated = false;
      } else {
        if (currentInput === '0' && num !== '.') {
          currentInput = num;
        } else {
          if (num === '.' && currentInput.includes('.')) return; // Prevent double decimal
          currentInput += num;
        }
      }
      updateDisplay();
    }

    function pressOp(op) {
      triggerHaptic();
      requestAccelerometerPermission();
      
      // Track magic key sequence
      trackMagicSequence(op);

      if (isEvaluated) {
        storedExpression = currentInput + ' ' + formatOpChar(op) + ' ';
        isEvaluated = false;
      } else {
        if (currentInput === 'Error') return;
        storedExpression += currentInput + ' ' + formatOpChar(op) + ' ';
      }
      currentInput = '0';
      updateDisplay();
    }

    function formatOpChar(op) {
      if (op === '/') return '÷';
      if (op === '*') return '×';
      if (op === '-') return '−';
      return op;
    }

    function pressEquals() {
      triggerHaptic();
      requestAccelerometerPermission();
      
      // Check for hidden settings code 3504
      if (storedExpression === '' && currentInput === '3504') {
        openSettings();
        currentInput = '0';
        updateDisplay();
        return;
      }
      
      if (storedExpression === '' || isEvaluated) return;

      // Build complete formula to evaluate
      let cleanExpr = storedExpression.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-') + currentInput;
      
      // Remove trailing space/operator if expression is incomplete
      try {
        // Prevent division by zero visually
        if (cleanExpr.includes('/0')) {
          currentInput = 'Error';
        } else {
          // Standard JS math eval
          let result = Function('"use strict";return (' + cleanExpr + ')')();
          
          // Format result (limit decimal places to avoid overflow)
          if (!Number.isInteger(result)) {
            result = parseFloat(result.toFixed(8));
          }
          currentInput = result.toString();
        }
      } catch (err) {
        currentInput = 'Error';
      }

      storedExpression = '';
      isEvaluated = true;
      updateDisplay();
    }

    // Manual clear resets animation and states
    function pressClear() {
      triggerHaptic();
      requestAccelerometerPermission();
      
      // Instantly clear display
      currentInput = '0';
      storedExpression = '';
      isEvaluated = false;
      magicSequence = []; // Reset pattern tracker on manual clear
      magicPrimed = false;
      motionTriggered = false;
      if (primingTimeout) {
        clearTimeout(primingTimeout);
        primingTimeout = null;
      }
      updateDisplay();
    }

    function pressBackspace() {
      triggerHaptic();
      requestAccelerometerPermission();
      if (isEvaluated) {
        pressClear();
        return;
      }
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function pressPercent() {
      triggerHaptic();
      requestAccelerometerPermission();
      let val = parseFloat(currentInput);
      if (!isNaN(val)) {
        currentInput = (val / 100).toString();
        updateDisplay();
      }
    }

    function pressNegate() {
      triggerHaptic();
      requestAccelerometerPermission();
      if (currentInput === '0' || currentInput === 'Error') return;
      if (currentInput.startsWith('-')) {
        currentInput = currentInput.slice(1);
      } else {
        currentInput = '-' + currentInput;
      }
      updateDisplay();
    }

    // MAGIC LOGIC TRACKING
    function trackMagicSequence(op) {
      // If starting sequence, capture prediction
      if (op === '/') {
        let parsedVal = parseFloat(currentInput.replace(/,/g, ''));
        tempPrediction = (!isNaN(parsedVal) && parsedVal !== 0) ? currentInput : '5';
      }

      magicSequence.push(op);
      
      // Only keep the last N operators matching pattern length
      if (magicSequence.length > SECRET_PATTERN.length) {
        magicSequence.shift();
      }

      // Check if secret sequence matches
      if (JSON.stringify(magicSequence) === JSON.stringify(SECRET_PATTERN)) {
        // Activate Magic!
        magicPrediction = tempPrediction;
        
        // Cancel any existing priming timeout
        if (primingTimeout) {
          clearTimeout(primingTimeout);
          primingTimeout = null;
        }

        // Reset state and wait for setup delay before priming
        motionTriggered = false;
        magicPrimed = false;

        primingTimeout = setTimeout(() => {
          magicPrimed = true;
          // Reset motion baseline to prevent instant trigger from old readings
          lastX = null;
          lastY = null;
          lastZ = null;
          primingTimeout = null;
        }, setupDelay * 1000);
        
        // Silently clear display to hide what just happened
        currentInput = '0';
        storedExpression = '';
        magicSequence = [];
        
        // Update display silently (no haptics/sounds to indicate change)
        setTimeout(() => {
          updateDisplay();
        }, 100);
      }
    }

    // MOTION AND SENSORS (ACCELEROMETER)
    let lastX = null, lastY = null, lastZ = null;

    function requestAccelerometerPermission() {
      if (accelerometerGranted) return;

      // iOS 13+ support
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              accelerometerGranted = true;
              window.addEventListener('devicemotion', handleMotion);
            }
          })
          .catch(console.error);
      } else {
        // Android or older browsers (standard device motion)
        window.addEventListener('devicemotion', handleMotion);
        accelerometerGranted = true;
      }
    }

    function handleMotion(event) {
      if (!magicPrimed || motionTriggered) return;

      let acc = event.acceleration;
      if (!acc || acc.x === null) {
        // Fallback to accelerationIncludingGravity if standard is unavailable
        acc = event.accelerationIncludingGravity;
      }

      if (!acc || acc.x === null) return;

      let currentX = acc.x;
      let currentY = acc.y;
      let currentZ = acc.z;

      if (lastX !== null) {
        // Calculate rate of change of acceleration (jerk/shake)
        let deltaX = Math.abs(currentX - lastX);
        let deltaY = Math.abs(currentY - lastY);
        let deltaZ = Math.abs(currentZ - lastZ);
        
        let totalChange = deltaX + deltaY + deltaZ;

        if (totalChange > motionThreshold) {
          // Phone movement detected!
          triggerMagicCountdown();
        }
      }

      lastX = currentX;
      lastY = currentY;
      lastZ = currentZ;
    }

    // Fallback: shake simulator for testing inside browser console
    window.simulateShake = function() {
      if (magicPrimed && !motionTriggered) {
        triggerMagicCountdown();
      }
    }

    function triggerMagicCountdown() {
      motionTriggered = true;
      magicPrimed = false; // Disable further motion triggers
      
      // Start countdown silently
      setTimeout(() => {
        revealMagicPrediction();
      }, revealDelay * 1000);
    }

    function revealMagicPrediction() {
      const magicPartEl = document.getElementById('magic-part');
      const typedPartEl = document.getElementById('result');

      // Vibrate phone heavily on reveal (if supported)
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }

      // Concatenate prediction to current input
      if (currentInput === '0' || currentInput === 'Error') {
        typedPartEl.innerText = ''; // Clear typed part
        currentInput = magicPrediction;
      } else {
        currentInput = magicPrediction + currentInput;
      }
      isEvaluated = true; // Ready for subsequent calculations

      // Update text in magic part
      magicPartEl.innerText = formatNumber(magicPrediction);
      
      // Animate the magic part in
      magicPartEl.classList.add('show-magic');
      adjustDisplayFontSize();
    }

    // SETTINGS OVERLAY LOGIC
    const settingsOverlayEl = document.getElementById('settings-overlay');
    
    function updateSliderText(sliderId, labelId, unit) {
      const val = document.getElementById(sliderId).value;
      document.getElementById(labelId).innerText = val + unit;
    }

    function openSettings() {
      // Load current option values to settings inputs
      document.getElementById('opt-default-prediction').value = defaultPrediction;
      document.getElementById('opt-delay').value = revealDelay;
      document.getElementById('lbl-delay').innerText = revealDelay + 's';
      document.getElementById('opt-setup-delay').value = setupDelay;
      document.getElementById('lbl-setup-delay').innerText = setupDelay + 's';
      document.getElementById('opt-sensitivity').value = motionThreshold;
      document.getElementById('lbl-sensitivity').innerText = motionThreshold;

      settingsOverlayEl.classList.add('visible');
    }

    function saveSettings() {
      // Save input values
      defaultPrediction = document.getElementById('opt-default-prediction').value || '5';
      revealDelay = parseFloat(document.getElementById('opt-delay').value) || 3.0;
      setupDelay = parseFloat(document.getElementById('opt-setup-delay').value) || 5.0;
      motionThreshold = parseFloat(document.getElementById('opt-sensitivity').value) || 1.5;

      // Save to LocalStorage
      localStorage.setItem('magic_defaultPrediction', defaultPrediction);
      localStorage.setItem('magic_revealDelay', revealDelay);
      localStorage.setItem('magic_setupDelay', setupDelay);
      localStorage.setItem('magic_motionThreshold', motionThreshold);

      // Reset magic prediction to new default
      magicPrediction = defaultPrediction;
      tempPrediction = defaultPrediction;
      magicPrimed = false;
      motionTriggered = false;
      if (primingTimeout) {
        clearTimeout(primingTimeout);
        primingTimeout = null;
      }

      // Hide settings
      settingsOverlayEl.classList.remove('visible');
      
      // Clear calculator display
      currentInput = '0';
      storedExpression = '';
      isEvaluated = false;
      updateDisplay();
    }
  </script>
</body>
</html>
